<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Redesign - Concept 2 (Technical)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-panel: #242424;
            --accent: #45E2FF;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border: #333;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .sidebar-preview {
            width: 300px;
            height: 600px;
            background: var(--bg-dark);
            border-right: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 8px;
        }

        .header h3 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #333;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .value {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .value.highlight {
            color: var(--accent);
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .terminal-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.6;
        }

        .log-entry {
            display: flex;
            gap: 8px;
            color: #aaa;
        }

        .log-entry::before {
            content: '>';
            color: var(--accent);
        }

        .bar-container {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }
    </style>
</head>

<body>

    <div class="sidebar-preview">
        <div class="header">
            <h3>System_Stats</h3>
        </div>

        <div>
            <div class="section-title">Resource Usage</div>
            <div class="stat-row">
                <span class="label">INPUT_TOKENS</span>
                <span class="value">1,240</span>
            </div>
            <div class="stat-row">
                <span class="label">OUTPUT_TOKENS</span>
                <span class="value">8,450</span>
            </div>
            <div class="stat-row">
                <span class="label">TOTAL_COST</span>
                <span class="value highlight">$0.0428</span>
            </div>
        </div>

        <div>
            <div class="section-title">Latency Metrics</div>
            <div class="terminal-box">
                <div class="stat-row" style="border: none; padding: 4px 0;">
                    <span class="label">ROUTING</span>
                    <span class="value">45ms</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 15%; background: #4caf50;"></div>
                </div>

                <div class="stat-row" style="border: none; padding: 4px 0; margin-top: 8px;">
                    <span class="label">INFERENCE</span>
                    <span class="value">1,200ms</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill" style="width: 75%;"></div>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">Active Models</div>
            <div class="terminal-box">
                <div class="log-entry">openai:gpt-4</div>
                <div class="log-entry">anthropic:claude-3-opus</div>
                <div class="log-entry">google:gemini-pro</div>
            </div>
        </div>
    </div>

</body>

</html>
