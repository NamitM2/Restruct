<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Redesign - Concept 1 (Modern Glass)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sand-50: #f6efe7;
            --clay-600: #8e3c2c;
            --clay-700: #5b2a1a;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--sand-50);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--clay-700);
        }

        .sidebar-preview {
            width: 300px;
            height: 600px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(246, 239, 231, 0.9) 100%);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(142, 60, 44, 0.1);
            padding: 24px;
            border-radius: 24px;
            /* Just for preview presentation */
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--clay-700);
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 4px 8px;
            background: rgba(142, 60, 44, 0.1);
            color: var(--clay-600);
            border-radius: 12px;
        }

        .stat-group {
            background: var(--white);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(142, 60, 44, 0.05);
            transition: transform 0.2s ease;
        }

        .stat-group:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(91, 42, 26, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--clay-700);
        }

        .stat-sub {
            font-size: 11px;
            color: rgba(91, 42, 26, 0.4);
            margin-top: 4px;
        }

        .cost-display {
            background: linear-gradient(135deg, #8e3c2c 0%, #b56747 100%);
            color: white;
        }

        .cost-display .stat-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .cost-display .stat-value {
            color: white;
            font-size: 24px;
        }

        .cost-display .stat-sub {
            color: rgba(255, 255, 255, 0.6);
        }

        .model-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .model-chip {
            font-size: 11px;
            padding: 6px 10px;
            background: rgba(142, 60, 44, 0.05);
            border: 1px solid rgba(142, 60, 44, 0.1);
            border-radius: 8px;
            color: var(--clay-700);
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: rgba(142, 60, 44, 0.1);
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="sidebar-preview">
        <div class="header">
            <h3>Session Stats</h3>
            <span class="badge">Live</span>
        </div>

        <div class="stat-group cost-display">
            <div class="stat-label">Total Cost</div>
            <div class="stat-value">$0.0428</div>
            <div class="stat-sub">Avg $0.002 / msg</div>
        </div>

        <div class="stat-group">
            <div class="stat-row">
                <span class="stat-label">Tokens</span>
            </div>
            <div style="display: flex; gap: 16px; margin-top: 8px;">
                <div>
                    <div class="stat-value">1,240</div>
                    <div class="stat-sub">Input</div>
                </div>
                <div style="width: 1px; background: rgba(0,0,0,0.05);"></div>
                <div>
                    <div class="stat-value">8,450</div>
                    <div class="stat-sub">Output</div>
                </div>
            </div>
        </div>

        <div class="stat-group">
            <div class="stat-row">
                <span class="stat-label">Latency</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <div>
                    <div class="stat-value">45ms</div>
                    <div class="stat-sub">Routing</div>
                </div>
                <div>
                    <div class="stat-value">1.2s</div>
                    <div class="stat-sub">Response</div>
                </div>
            </div>
        </div>

        <div class="stat-group">
            <div class="stat-label">Models Used</div>
            <div class="model-list">
                <div class="model-chip">GPT-4</div>
                <div class="model-chip">Claude 3 Opus</div>
                <div class="model-chip">Gemini Pro</div>
            </div>
        </div>
    </div>

</body>

</html>
