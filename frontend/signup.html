<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Sign Up - Restruct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --sand-50: #f6efe7;
            --sand-100: #f1e5d7;
            --sand-200: #e6d5c0;
            --sand-400: #d0b190;
            --clay-400: #c98454;
            --clay-500: #b56747;
            --clay-600: #8e3c2c;
            --clay-700: #5b2a1a;
            --ink: #2b1d14;
            --muted: rgba(43, 29, 20, 0.7);
            --white: #fffaf5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--sand-50);
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Custom scrollbar styling */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--clay-600) var(--sand-100);
        }

        *::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        *::-webkit-scrollbar-track {
            background: var(--sand-100);
        }

        *::-webkit-scrollbar-thumb {
            background: var(--clay-600);
            border-radius: 6px;
            border: 2px solid var(--sand-100);
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--clay-700);
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .model-slider-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: rgba(142, 60, 44, 0.04);
            border-top: 1px solid rgba(142, 60, 44, 0.15);
            border-bottom: 1px solid rgba(142, 60, 44, 0.15);
            padding: 12px 0;
            display: flex;
            align-items: center;
        }

        .signup-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .mesh-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 0;
        }

        .mesh-background canvas {
            width: 100%;
            height: 100%;
        }

        .signup-card {
            position: relative;
            z-index: 1;
            background: var(--white);
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 2px 8px rgba(43, 29, 20, 0.08);
            max-width: 480px;
            width: 100%;
        }

        .model-slider {
            display: flex;
            gap: 12px;
            animation: slide 25s linear infinite;
            width: fit-content;
            padding-left: 12px;
        }

        .model-badge {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(201, 132, 84, 0.15);
            transition: opacity 0.2s ease;
        }

        .model-badge:hover {
            opacity: 0.7;
        }

        .model-badge img {
            height: 40px;
            width: 120px;
            object-fit: contain;
            display: block;
        }

        /* Individual logo scaling for text normalization */
        .model-badge img[src*="chatgpt-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="claude-logo"] {
            transform: scale(2.88);
        }

        .model-badge img[src*="qwen-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="mistral-logo"] {
            transform: scale(1.65);
        }

        .model-badge img[src*="perplexity-logo"] {
            transform: scale(1.56);
        }

        .model-badge img[src*="grok-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="deepseek-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="llama-logo"] {
            transform: scale(1.32);
        }

        .model-badge img[src*="gemini-logo"] {
            transform: scale(4.0);
        }

        @keyframes slide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-120px * 9 - 12px * 9));
            }
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-container img {
            height: 48px;
            width: 48px;
        }

        .logo-container h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--ink);
        }

        .signup-header p {
            color: var(--muted);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--ink);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--sand-200);
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            background: var(--white);
            color: var(--ink);
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--clay-600);
            box-shadow: 0 0 0 3px rgba(142, 60, 44, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(43, 29, 20, 0.4);
        }

        .form-group .error {
            border-color: #c94444;
        }

        .error-message {
            color: #c94444;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .signup-button {
            width: 100%;
            padding: 14px 24px;
            background: var(--clay-600);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .signup-button:hover {
            background: var(--clay-700);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(142, 60, 44, 0.2);
        }

        .signup-button:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--sand-200);
        }

        .form-footer a {
            color: var(--clay-600);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: var(--clay-700);
            text-decoration: underline;
        }
    </style>
</head>

    <script>
        // Mesh Animation
        (function() {
            const canvas = document.getElementById('meshCanvas');
            const container = document.getElementById('meshBackground');
            if (!canvas || !container) return;

            const ctx = canvas.getContext('2d');
            const config = {
                gridSize: 35,
                gravityStrength: 18,
                influenceRadius: 100,
                dampening: 0.95,
                returnSpeed: 0.05,
                lineColor: 'rgba(142, 60, 44, 0.15)',
                maxDisplacement: 20
            };

            let points = [];
            let originalPoints = [];
            let gridDimensions = { cols: 0, rows: 0 };
            let mouse = { x: -1000, y: -1000, isActive: false };

            function resizeCanvas() {
                const rect = container.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                canvas.width = rect.width;
                canvas.height = rect.height;
                initializeGrid();
            }

            function initializeGrid() {
                points = [];
                originalPoints = [];
                const cols = Math.ceil(canvas.width / config.gridSize) + 1;
                const rows = Math.ceil(canvas.height / config.gridSize) + 1;
                gridDimensions = { cols, rows };

                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        const x = i * config.gridSize;
                        const y = j * config.gridSize;
                        points.push({ x, y, vx: 0, vy: 0, originalX: x, originalY: y });
                        originalPoints.push({ x, y });
                    }
                }
            }

            function updatePoints() {
                points.forEach((point, index) => {
                    const original = originalPoints[index];
                    const dx = mouse.x - point.x;
                    const dy = mouse.y - point.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (mouse.isActive && distance < config.influenceRadius) {
                        const force = (1 - distance / config.influenceRadius) * config.gravityStrength;
                        const angle = Math.atan2(dy, dx);
                        point.vx += Math.cos(angle) * force * 0.01;
                        point.vy += Math.sin(angle) * force * 0.01;
                    } else {
                        point.vx += (original.x - point.x) * config.returnSpeed;
                        point.vy += (original.y - point.y) * config.returnSpeed;
                    }

                    point.vx *= config.dampening;
                    point.vy *= config.dampening;
                    point.x += point.vx;
                    point.y += point.vy;

                    const dispX = point.x - original.x;
                    const dispY = point.y - original.y;
                    const displacement = Math.sqrt(dispX * dispX + dispY * dispY);

                    if (displacement > config.maxDisplacement) {
                        const scale = config.maxDisplacement / displacement;
                        point.x = original.x + dispX * scale;
                        point.y = original.y + dispY * scale;
                    }
                });
            }

            function drawMesh() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const { cols, rows } = gridDimensions;
                if (!cols || !rows || points.length === 0) return;

                ctx.strokeStyle = config.lineColor;
                ctx.lineWidth = 1;

                for (let j = 0; j < rows; j++) {
                    ctx.beginPath();
                    for (let i = 0; i < cols; i++) {
                        const index = i * rows + j;
                        const point = points[index];
                        if (!point) continue;
                        if (i === 0) ctx.moveTo(point.x, point.y);
                        else ctx.lineTo(point.x, point.y);
                    }
                    ctx.stroke();
                }

                for (let i = 0; i < cols; i++) {
                    ctx.beginPath();
                    for (let j = 0; j < rows; j++) {
                        const index = i * rows + j;
                        const point = points[index];
                        if (!point) continue;
                        if (j === 0) ctx.moveTo(point.x, point.y);
                        else ctx.lineTo(point.x, point.y);
                    }
                    ctx.stroke();
                }
            }

            function animate() {
                updatePoints();
                drawMesh();
                requestAnimationFrame(animate);
            }

            const parentElement = container.parentElement;

            window.addEventListener('resize', resizeCanvas);
            if (parentElement) {
                parentElement.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top, isActive: true };
                });
                parentElement.addEventListener('mouseleave', () => {
                    mouse.isActive = false;
                });
            }

            setTimeout(() => {
                resizeCanvas();
                requestAnimationFrame(animate);
            }, 50);
        })();

        // Form submit handler
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordError = document.getElementById('passwordError');
            const confirmInput = document.getElementById('confirmPassword');

            // Reset error state
            passwordError.style.display = 'none';
            confirmInput.classList.remove('error');

            // Check password match
            if (password !== confirmPassword) {
                passwordError.style.display = 'block';
                confirmInput.classList.add('error');
                return;
            }

            // TODO: Add actual registration logic here
            console.log('Sign up attempt:', { email, password });

            // For now, just redirect to main app
            window.location.href = 'index.html';
        });
    </script>
