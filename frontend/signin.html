<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Restruct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="assets/logo.png">
    <style>
        :root {
            --sand-50: #f6efe7;
            --sand-100: #f1e5d7;
            --sand-200: #e6d5c0;
            --sand-400: #d0b190;
            --clay-400: #c98454;
            --clay-500: #b56747;
            --clay-600: #8e3c2c;
            --clay-700: #5b2a1a;
            --ink: #2b1d14;
            --muted: rgba(43, 29, 20, 0.7);
            --white: #fffaf5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--sand-50);
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Custom scrollbar styling */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--clay-600) var(--sand-100);
        }

        *::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        *::-webkit-scrollbar-track {
            background: var(--sand-100);
        }

        *::-webkit-scrollbar-thumb {
            background: var(--clay-600);
            border-radius: 6px;
            border: 2px solid var(--sand-100);
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--clay-700);
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .model-slider-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: rgba(142, 60, 44, 0.04);
            border-top: 1px solid rgba(142, 60, 44, 0.15);
            border-bottom: 1px solid rgba(142, 60, 44, 0.15);
            padding: 12px 0;
            display: flex;
            align-items: center;
        }

        .signin-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .model-slider {
            display: flex;
            gap: 12px;
            animation: slide 25s linear infinite;
            width: fit-content;
            padding-left: 12px;
        }

        .model-slider:hover {
            animation-play-state: paused;
        }

        .model-badge {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(201, 132, 84, 0.15);
            transition: opacity 0.2s ease;
        }

        .model-badge:hover {
            opacity: 0.7;
        }

        .model-badge img {
            height: 40px;
            width: 120px;
            object-fit: contain;
            display: block;
        }

        /* Individual logo scaling for text normalization */
        .model-badge img[src*="chatgpt-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="claude-logo"] {
            transform: scale(2.88);
        }

        .model-badge img[src*="qwen-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="mistral-logo"] {
            transform: scale(1.65);
        }

        .model-badge img[src*="perplexity-logo"] {
            transform: scale(1.56);
        }

        .model-badge img[src*="grok-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="deepseek-logo"] {
            transform: scale(1.0);
        }

        .model-badge img[src*="llama-logo"] {
            transform: scale(1.32);
        }

        .model-badge img[src*="gemini-logo"] {
            transform: scale(4.0);
        }

        @keyframes slide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-120px * 9 - 12px * 9));
            }
        }

        .signin-card {
            background: var(--white);
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 2px 8px rgba(43, 29, 20, 0.08);
            max-width: 480px;
            width: 100%;
        }

        .signin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-container img {
            height: 48px;
            width: 48px;
        }

        .logo-container h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--ink);
        }

        .signin-header p {
            color: var(--muted);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--ink);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--sand-200);
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            background: var(--white);
            color: var(--ink);
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--clay-600);
            box-shadow: 0 0 0 3px rgba(142, 60, 44, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(43, 29, 20, 0.4);
        }

        .signin-button {
            width: 100%;
            padding: 14px 24px;
            background: var(--clay-600);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .signin-button:hover {
            background: var(--clay-700);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(142, 60, 44, 0.2);
        }

        .signin-button:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--sand-200);
        }

        .form-footer a {
            color: var(--clay-600);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: var(--clay-700);
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--sand-200);
        }

        .divider span {
            background: var(--white);
            padding: 0 16px;
            position: relative;
            color: var(--muted);
            font-size: 14px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--ink);
        }

        .remember-forgot input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--clay-600);
        }

        .remember-forgot a {
            color: var(--clay-600);
            text-decoration: none;
            font-weight: 500;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }
    </style>
</head>

                <form id="signinForm">
